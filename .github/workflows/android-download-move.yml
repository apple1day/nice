name: Android 1.3.14 download and move
on:
  push:
    branches: [fix/android-server-downloads]
    paths: ['android/app/**', '.github/workflows/android-download-move.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install fixture and verification tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          if [[ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'build-tools;35.0.0'
          fi
      - name: Select existing signing identity or a separate preview
        env:
          DOWNLOADS_STORE: ${{ secrets.NICE_DOWNLOADS_KEYSTORE_B64 }}
          DOWNLOADS_PASSWORD: ${{ secrets.NICE_DOWNLOADS_STORE_PASS }}
        run: |
          set -euo pipefail
          if [[ -n "$DOWNLOADS_STORE" && -n "$DOWNLOADS_PASSWORD" ]]; then
            umask 077
            printf %s "$DOWNLOADS_STORE" | base64 -d > "$RUNNER_TEMP/nice-downloads.p12"
            printf 'NICE_MOBILE_STORE_FILE=%s\nNICE_MOBILE_STORE_PASS=%s\nBUILD_KIND=mobile\n' "$RUNNER_TEMP/nice-downloads.p12" "$DOWNLOADS_PASSWORD" >> "$GITHUB_ENV"
          else
            echo 'BUILD_KIND=preview' >> "$GITHUB_ENV"
            echo '::notice::Existing downloads signing key unavailable; only a separate preview APK can be built.'
          fi
      - name: Build and verify APK
        working-directory: android
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/move-apk"
          if [[ "$BUILD_KIND" == mobile ]]; then
            ./gradlew -PtestMobile -PstandaloneDownloads :app:assembleMobile :app:assembleMobileAndroidTest :app:testMobileUnitTest
            apk="$RUNNER_TEMP/move-apk/NiceVideos-Android-1.3.14.apk"
            cp app/build/outputs/apk/mobile/app-mobile.apk "$apk"
            old=releases/1.3.12/NiceVideos-Android-1.3.12.apk
            "$sdk/apksigner" verify --print-certs "$old" > "$RUNNER_TEMP/old-cert"
            "$sdk/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/new-cert"
            diff <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/old-cert") <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/new-cert")
            id=com.anxiong.nicevideos.mobile.downloads
          else
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
            apk="$RUNNER_TEMP/move-apk/NiceVideos-Android-1.3.14-Preview.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$apk"
            id=com.anxiong.nicevideos.vr.preview
          fi
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/aapt" dump badging "$apk" | grep -F "package: name='$id' versionCode='26' versionName='1.3.14'"
          sha256sum "$apk"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test the download-delete flow on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && if [ "$BUILD_KIND" = mobile ]; then ./gradlew -PtestMobile -PstandaloneDownloads :app:connectedMobileAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.anxiong.nicevideos.ServerDownloadTest,com.anxiong.nicevideos.BatchDeleteDownloadsTest; else ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.anxiong.nicevideos.ServerDownloadTest,com.anxiong.nicevideos.BatchDeleteDownloadsTest; fi
      - uses: actions/upload-artifact@v4
        with:
          name: NiceVideos-1.3.14-${{ env.BUILD_KIND }}
          path: ${{ runner.temp }}/move-apk/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Download-move-test-results
          path: android/app/build/outputs/androidTest-results/
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nice-downloads.p12"
