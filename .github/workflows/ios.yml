name: iOS native offline VLC app
on:
  push:
    branches:
      - 'v1.2_batch_delete'
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build and fixture tools
        run: |
          for tool in xcodegen cocoapods ffmpeg; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
      - name: Test project repair, signing preservation and XML checks without pyexpat
        run: python3 -m unittest discover -s ios/tools -p 'test_*.py' -v
      - name: Test signing expiry and notification scheduling
        run: bash ios/check-signing.sh
      - name: Test batch selection and stale task pruning
        run: bash ios/check-batch-delete.sh
      - name: Test recoverable local file deletion
        run: bash ios/check-watch-delete.sh
      - name: Test fullscreen controls and auto-hide timing
        run: bash ios/check-player-controls.sh
      - name: Test nonblocking player resource retirement
        run: bash ios/check-player-teardown.sh
      - name: Test local playlist order and swipe directions
        run: bash ios/check-playlist.sh
      - name: Verify offline 8K conversion, moving stereo pictures, replay and seeks
        run: |
          if ! bash ios/test.sh vr-motion > ios/vr-motion.log 2>&1; then
            grep -E 'error:|Failing tests:|threw error|Test Case.*(failed|passed)|VR conversion test:|NiceVRConvert|unexpected exit' ios/vr-motion.log | tail -n 50 || true
            tail -n 60 ios/vr-motion.log
            exit 1
          fi
          grep -F '8K60 VLC/Metal ' ios/vr-motion.log || true
          grep 'Test Case.*passed' ios/vr-motion.log | tail -n 8
      - name: Run remaining app and UI tests
        run: |
          if ! bash ios/test.sh remaining-after-vr > ios/xcode-tests.log 2>&1; then
            grep -E 'error:|Failing tests:|threw error' ios/xcode-tests.log | tail -n 40 || true
            tail -n 140 ios/xcode-tests.log
            exit 1
          fi
          tail -n 100 ios/xcode-tests.log
      - name: Show resolved dependency lock
        if: always()
        run: cat ios/Podfile.lock 2>/dev/null || true
      - name: Save test results and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/DerivedData/Logs/Test/*.xcresult
            ios/Podfile.lock
            ios/xcode-tests.log
            ios/vr-motion.log

  iphone:
    name: Build iPhone IPA
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode workspace
        run: |
          for tool in xcodegen cocoapods; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
          bash ios/setup.sh
      - name: Compile Release for iPhone device SDK without signing
        run: |
          xcodebuild -quiet -workspace ios/NiceVideos.xcworkspace -scheme NiceVideos \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DerivedData-device CODE_SIGNING_ALLOWED=NO build
      - name: Package the iPhone build for local signing
        shell: bash
        run: |
          set -euo pipefail
          app=ios/DerivedData-device/Build/Products/Release-iphoneos/NiceVideos.app
          plist="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$plist")" = iPhoneOS
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          lipo "$app/$executable" -verify_arch arm64
          test -s "$app/default.metallib"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          mkdir -p "$RUNNER_TEMP/ios-package/Payload" ios/device-package
          ditto "$app" "$RUNNER_TEMP/ios-package/Payload/NiceVideos.app"
          ipa="ios/device-package/NiceVideos-iOS-$version-$build-unsigned.ipa"
          ditto -c -k --norsrc --keepParent "$RUNNER_TEMP/ios-package/Payload" "$ipa"
          unzip -tq "$ipa"
          shasum -a 256 "$ipa"
      - name: Save unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: NiceVideos-iPhone-unsigned
          path: ios/device-package/*.ipa
          compression-level: 0
