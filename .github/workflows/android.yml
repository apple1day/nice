name: Classic Android 1.0 export
on:
  push:
    branches: [fix/android-classic-export]
    paths:
      - 'android/**'
      - '!android/*.apk'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install media fixture tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Build the classic app, unsigned release and device tests
        working-directory: android
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Verify package identity and release output
        working-directory: android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/classic-badging.txt"
          grep -F "package: name='com.anxiong.nicevideos' versionCode='2' versionName='1.0.1'" "$RUNNER_TEMP/classic-badging.txt"
          if "$tools/apksigner" verify "$apk"; then echo "Expected an unsigned artifact for signing by the original owner"; exit 1; fi
          cp "$apk" NiceVideos-1.0.1-classic-export-unsigned.apk
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run playback and folder export tests on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest
      - name: Test both shipped 83 KB APKs, signature checks and existing downloads on Android 15
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: classic-export-api35
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && bash tools/test_classic_export.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Classic-export-tests
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: Classic-export-for-original-signer
          path: android/NiceVideos-1.0.1-classic-export-unsigned.apk

  register:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Classic-export-for-original-signer
      - name: Register unsigned release for the original signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha'
          import base64, json, pathlib
          data = pathlib.Path("NiceVideos-1.0.1-classic-export-unsigned.apk").read_bytes()
          print(json.dumps({"content": base64.b64encode(data).decode("ascii"), "encoding": "base64"}))
          PY
          sha256sum NiceVideos-1.0.1-classic-export-unsigned.apk
