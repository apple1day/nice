name: Android mobile download and playback
on:
  push:
    branches: ['feat/android-1.3.10']
    paths: ['android/app/**', 'android/test-fixtures.sh', 'android/tools/check_mobile_transfers.sh', '.github/workflows/android-mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install fixture and recovery tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg age
          fi
      - name: Prepare mobile signer
        env:
          PRIVATE_STORE: ${{ secrets.NICE_MOBILE_KEYSTORE_B64 }}
          PRIVATE_PASSWORD: ${{ secrets.NICE_MOBILE_STORE_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          sign="$RUNNER_TEMP/nice-mobile-sign"
          mkdir -p "$sign"
          if [[ -n "$PRIVATE_STORE" && -n "$PRIVATE_PASSWORD" ]]; then
            printf %s "$PRIVATE_STORE" | base64 -d > "$sign/release.p12"
            password="$PRIVATE_PASSWORD"
          else
            if [[ -e android/NiceVideos-Mobile.apk ]]; then
              echo "Use the existing mobile release key to distribute the next update."; exit 1
            fi
            password=$(openssl rand -hex 32)
            echo "::add-mask::$password"
            printf '%s\n' "$password" > "$sign/password.txt"
            keytool -genkeypair -storetype PKCS12 -alias nice-mobile -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 15000 -dname 'CN=NiceVideos Mobile' -keystore "$sign/release.p12" -storepass:file "$sign/password.txt"
            gh api "users/$GITHUB_REPOSITORY_OWNER/keys?per_page=100" --jq '.[].key' | awk '/^ssh-(rsa|ed25519) /' > "$sign/recipients"
            test -s "$sign/recipients"
            tar -C "$sign" -cf - release.p12 password.txt | age -R "$sign/recipients" -o "$RUNNER_TEMP/NiceVideos-Mobile-Recovery.tar.age"
          fi
          echo "::add-mask::$password"
          printf 'NICE_MOBILE_STORE_FILE=%s\nNICE_MOBILE_STORE_PASS=%s\n' "$sign/release.p12" "$password" >> "$GITHUB_ENV"
      - name: Build mobile release and its exact instrumentation target
        working-directory: android
        run: ./gradlew --stacktrace -PtestMobile :app:assembleMobile :app:assembleMobileAndroidTest :app:testMobileUnitTest
      - name: Verify signed mobile APK
        working-directory: android
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/mobile/app-mobile.apk NiceVideos-Mobile.apk
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/apksigner" verify --verbose --print-certs NiceVideos-Mobile.apk
          "$sdk/aapt" dump badging NiceVideos-Mobile.apk > "$RUNNER_TEMP/badging"
          grep -F "package: name='com.anxiong.nicevideos.mobile' versionCode='22' versionName='1.3.10'" "$RUNNER_TEMP/badging"
          sha256sum NiceVideos-Mobile.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android 11 release playback, uploads and public downloads
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && ./gradlew -PtestMobile :app:connectedMobileAndroidTest
      - name: Keep Android 11 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Android-11-tests
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/tests/
      - name: Android 15 release download and upload
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: nice-mobile-api35
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/tools/check_mobile_transfers.sh
      - name: Keep Android 15 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Android-15-tests
          path: ${{ runner.temp }}/nice-mobile-api35-result.txt
      - name: Verify same distributed binary
        working-directory: android
        run: cmp NiceVideos-Mobile.apk app/build/outputs/apk/mobile/app-mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NiceVideos-Mobile
          path: android/NiceVideos-Mobile.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mobile-owner-encrypted-recovery
          if-no-files-found: ignore
          path: ${{ runner.temp }}/NiceVideos-Mobile-Recovery.tar.age
      - name: Clear temporary signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/nice-mobile-sign"

  register:
    needs: mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: NiceVideos-Mobile}
      - name: Register the tested mobile APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha'
          import json, pathlib, base64
          b = pathlib.Path('NiceVideos-Mobile.apk').read_bytes()
          print(json.dumps({'encoding':'base64','content':base64.b64encode(b).decode()}))
          PY
          sha256sum NiceVideos-Mobile.apk
