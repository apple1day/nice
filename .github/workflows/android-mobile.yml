name: Android mobile download and playback
on:
  push:
    branches: ['fix/android-bulk-delete']
    paths: ['android/app/**', 'android/test-fixtures.sh', 'android/tools/check_mobile_transfers.sh', 'android/tools/sign_mobile_update.command', '.github/workflows/android-mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install fixture and recovery tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg age
          fi
      - name: Select compatible update or independently installable build
        env:
          ORIGINAL_STORE: ${{ secrets.NICE_MOBILE_KEYSTORE_B64 }}
          ORIGINAL_PASSWORD: ${{ secrets.NICE_MOBILE_STORE_PASS }}
          DOWNLOADS_STORE: ${{ secrets.NICE_DOWNLOADS_KEYSTORE_B64 }}
          DOWNLOADS_PASSWORD: ${{ secrets.NICE_DOWNLOADS_STORE_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          sign="$RUNNER_TEMP/nice-mobile-sign"
          mkdir -p "$sign"
          if [[ -n "$ORIGINAL_STORE" && -n "$ORIGINAL_PASSWORD" ]]; then
            printf %s "$ORIGINAL_STORE" | base64 -d > "$sign/release.p12"
            password="$ORIGINAL_PASSWORD"
            id='com.anxiong.nicevideos.mobile'
            flags=''
          else
            id='com.anxiong.nicevideos.mobile.downloads'
            flags='-PstandaloneDownloads'
            if [[ -n "$DOWNLOADS_STORE" && -n "$DOWNLOADS_PASSWORD" ]]; then
              printf %s "$DOWNLOADS_STORE" | base64 -d > "$sign/release.p12"
              password="$DOWNLOADS_PASSWORD"
            else
              if [[ -f android/releases/1.3.11/NiceVideos-Android-1.3.11.apk ]]; then
                echo 'Supply the established downloads signing identity for subsequent releases.'; exit 1
              fi
              password=$(openssl rand -hex 32)
              echo "::add-mask::$password"
              printf '%s\n' "$password" > "$sign/password.txt"
              keytool -genkeypair -storetype PKCS12 -alias nice-mobile -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 13000 -dname 'CN=NiceVideos Downloads' -keystore "$sign/release.p12" -storepass:file "$sign/password.txt"
              gh api "users/$GITHUB_REPOSITORY_OWNER/keys?per_page=100" --jq '.[].key' | awk '/^ssh-(rsa|ed25519) /' > "$sign/recipients"
              echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMYzlcjAwomYe2/HM6ZdAUTmMp3DPFSWi36aBWulS5as nice-mobile-downloads-recovery' >> "$sign/recipients"
              tar -C "$sign" -cf - release.p12 password.txt | age -R "$sign/recipients" -o "$RUNNER_TEMP/NiceVideos-Downloads-Recovery.tar.age"
            fi
          fi
          echo "::add-mask::$password"
          printf 'NICE_MOBILE_STORE_FILE=%s\nNICE_MOBILE_STORE_PASS=%s\nMOBILE_ID=%s\nMOBILE_FLAGS=%s\n' "$sign/release.p12" "$password" "$id" "$flags" >> "$GITHUB_ENV"
      - name: Build mobile release and its exact instrumentation target
        working-directory: android
        run: ./gradlew --stacktrace -PtestMobile $MOBILE_FLAGS :app:assembleMobile :app:assembleMobileAndroidTest :app:testMobileUnitTest
      - name: Verify signed mobile APK
        working-directory: android
        run: |
          set -euo pipefail
          cp NiceVideos-Mobile.apk "$RUNNER_TEMP/original-mobile.apk"
          cp app/build/outputs/apk/mobile/app-mobile.apk NiceVideos-Mobile.apk
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/apksigner" verify --verbose --print-certs NiceVideos-Mobile.apk
          "$sdk/aapt" dump badging NiceVideos-Mobile.apk > "$RUNNER_TEMP/badging"
          grep -F "package: name='$MOBILE_ID' versionCode='23' versionName='1.3.11'" "$RUNNER_TEMP/badging"
          if [[ "$MOBILE_ID" == com.anxiong.nicevideos.mobile ]]; then
            "$sdk/apksigner" verify --print-certs NiceVideos-Mobile.apk | grep -F 'certificate SHA-256 digest: 94b219553d6b9f07108b25d9be09764e94445e9f140200635e33ba7626f6a21b'
          fi
          sha256sum NiceVideos-Mobile.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android 11 release playback, uploads and public downloads
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && ./gradlew -PtestMobile $MOBILE_FLAGS :app:connectedMobileAndroidTest
      - name: Keep Android 11 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Android-11-tests
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/tests/
      - name: Verify same distributed binary
        working-directory: android
        run: cmp NiceVideos-Mobile.apk app/build/outputs/apk/mobile/app-mobile.apk
      - name: Android 15 installation, deletion and transfers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: nice-mobile-api35
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/tools/check_mobile_transfers.sh
      - name: Keep Android 15 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Android-15-tests
          path: |
            ${{ runner.temp }}/nice-mobile-api35-result.txt
            ${{ runner.temp }}/owner-upgrade-test.txt
            ${{ runner.temp }}/nice-ui-state.*
      - uses: actions/upload-artifact@v4
        with:
          name: NiceVideos-Mobile
          path: android/NiceVideos-Mobile.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mobile-owner-encrypted-recovery
          if-no-files-found: ignore
          path: ${{ runner.temp }}/NiceVideos-Downloads-Recovery.tar.age
      - name: Assemble local owner update kit for existing installations
        if: env.MOBILE_ID == 'com.anxiong.nicevideos.mobile.downloads'
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew -PtestMobile :app:assembleMobile
          kit="$RUNNER_TEMP/owner-kit"
          mkdir -p "$kit/tools"
          cp app/build/outputs/apk/mobile/app-mobile.apk "$kit/payload.apk"
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/zipalign" -c -P 16 4 "$kit/payload.apk"
          "$sdk/aapt" dump badging "$kit/payload.apk" > "$RUNNER_TEMP/payload.badging"
          grep -F "package: name='com.anxiong.nicevideos.mobile' versionCode='23' versionName='1.3.11'" "$RUNNER_TEMP/payload.badging"
          cp "$sdk/lib/apksigner.jar" "$kit/apksigner.jar"
          cp tools/sign_mobile_update.command "$kit/更新安装包.command"
          tmpgo=$(mktemp -d)
          cd "$tmpgo"
          go mod init nice-release-helper
          go get filippo.io/age/cmd/age@v1.2.1
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -o "$kit/tools/age-$arch" filippo.io/age/cmd/age
          done
          # Exercise real v2/v3 re-signing of the exact payload locally in CI.
          java -jar "$kit/apksigner.jar" sign --ks "$NICE_MOBILE_STORE_FILE" --ks-type PKCS12 --ks-key-alias nice-mobile --ks-pass env:NICE_MOBILE_STORE_PASS --out "$tmpgo/resigned.apk" "$kit/payload.apk"
          java -jar "$kit/apksigner.jar" verify "$tmpgo/resigned.apk"
      - uses: actions/upload-artifact@v4
        if: success() && env.MOBILE_ID == 'com.anxiong.nicevideos.mobile.downloads'
        with:
          name: Mobile-owner-update-kit
          path: ${{ runner.temp }}/owner-kit/
      - name: Clear temporary signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/nice-mobile-sign"

  register:
    needs: mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: NiceVideos-Mobile}
      - name: Register the tested mobile APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha'
          import json, pathlib, base64
          b = pathlib.Path('NiceVideos-Mobile.apk').read_bytes()
          print(json.dumps({'encoding':'base64','content':base64.b64encode(b).decode()}))
          PY
          sha256sum NiceVideos-Mobile.apk
