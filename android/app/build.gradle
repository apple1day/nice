plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anxiong.nicevideos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anxiong.nicevideos'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '1.3.12'
        manifestPlaceholders = [niceAppLabel: 'Nice 视频 VR']
        resValue 'bool', 'start_in_vr_library', 'false'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (System.getenv('NICE_MOBILE_STORE_FILE')) {
            mobile {
                storeFile file(System.getenv('NICE_MOBILE_STORE_FILE'))
                storePassword System.getenv('NICE_MOBILE_STORE_PASS')
                keyAlias 'nice-mobile'
                keyPassword System.getenv('NICE_MOBILE_STORE_PASS')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.vr.preview' }
        release { applicationIdSuffix '.vr.preview' }
        vrPreview {
            initWith debug
            applicationIdSuffix '.vr.preview.vrplayer'
            manifestPlaceholders = [niceAppLabel: 'Nice VR 播放器']
            resValue 'bool', 'start_in_vr_library', 'true'
            matchingFallbacks = ['debug']
        }
        mobile {
            initWith release
            applicationIdSuffix = providers.gradleProperty('standaloneDownloads').isPresent() ? '.mobile.downloads' : '.mobile'
            manifestPlaceholders = [niceAppLabel: providers.gradleProperty('standaloneDownloads').isPresent() ? 'Nice 视频·下载' : 'Nice 视频']
            if (signingConfigs.findByName('mobile')) signingConfig signingConfigs.mobile
            matchingFallbacks = ['release']
        }
    }
    testBuildType = providers.gradleProperty('testMobile').isPresent() ? 'mobile' : 'debug'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.androidTest.assets.srcDir(layout.buildDirectory.dir('generated/playbackFixtures'))
}

def fixtures = tasks.register('generatePlaybackFixtures', Exec) {
    def script = rootProject.file('test-fixtures.sh')
    def helper = rootProject.file('../ios/tools/make_large_mp4_fixture.py')
    def destination = layout.buildDirectory.dir('generated/playbackFixtures')
    inputs.files(script, helper)
    outputs.dir(destination)
    commandLine 'bash', script.absolutePath, destination.get().asFile.absolutePath, helper.absolutePath
}
tasks.matching { it.name in ['mergeDebugAndroidTestAssets', 'mergeMobileAndroidTestAssets'] }.configureEach { dependsOn fixtures }

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
