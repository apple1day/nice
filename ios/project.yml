name: NiceVideos
options:
  bundleIdPrefix: com.anxiong
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NiceVideos:
    type: application
    platform: iOS
    sources:
      - path: NiceVideos
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anxiong.nicevideos
        INFOPLIST_FILE: NiceVideos/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
  NiceVideosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: NiceVideos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anxiong.nicevideos.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NiceVideos:
    build:
      targets:
        NiceVideos: all
        NiceVideosTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - NiceVideosTests
