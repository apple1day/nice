name: NiceVideos
options:
  bundleIdPrefix: com.anxiong
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  NiceVideos:
    type: application
    platform: iOS
    sources:
      - path: NiceVideos
        excludes:
          - Info.plist
      - path: Licenses
        type: folder
    preBuildScripts:
      - name: Check generated source membership
        script: python3 "$SRCROOT/tools/project_doctor.py" check --sources-only
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anxiong.nicevideos
        CLANG_ENABLE_OBJC_ARC: YES
        SWIFT_OBJC_BRIDGING_HEADER: NiceVideos/NiceVideos-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: NiceVideos/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
  NiceVideosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
          - '*.sh'
      - path: Tests/Fixtures
        type: folder
    dependencies:
      - target: NiceVideos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anxiong.nicevideos.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NiceVideos:
    build:
      targets:
        NiceVideos: all
        NiceVideosTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - NiceVideosTests
